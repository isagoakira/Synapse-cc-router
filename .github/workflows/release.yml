name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build distributions
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CC Router v${{ steps.tag.outputs.version }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Build and tag Docker image
        run: |
          echo "Docker build command (requires Docker Hub credentials):"
          echo "  docker build -t cc-router:${{ steps.tag.outputs.version }} ."
          echo "  docker tag cc-router:${{ steps.tag.outputs.version }} cc-router:latest"
          echo "  docker push cc-router:${{ steps.tag.outputs.version }}"
